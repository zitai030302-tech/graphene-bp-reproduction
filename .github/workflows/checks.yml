name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-modern.txt
      - name: Install dependencies
        run: pip install -r requirements-modern.txt
      - name: Compile scripts
        run: python -m compileall scripts
      - name: Check command-line entry point
        run: python scripts/run_reproduction.py --help > /dev/null
      - name: Check subject splits and preprocessing
        run: python -m unittest discover -s tests -v
      - name: Run generated-cohort benchmark
        run: python scripts/benchmark_models.py --synthetic --output /tmp/bioz-model-benchmark

